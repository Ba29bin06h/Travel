<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巴比恩國外遊記</title>

<style>
/* ============================================================
   1. 全域變數、基礎標籤與深色模式設定
   ============================================================ */
:root {
  --main: #2563eb;
  --main-dark: #1e40af;
  --bg: linear-gradient(to right, #e6f2ff, #e6fce6);
  --card: #ffffff;
  --text: #111827;
  --border: #e5e7eb;
  --table-head: #f1f5f9;
  --table-hover: #eef2ff;
  --head-bg: linear-gradient(to right, #dbeafe, #dcfce7);
  --head-bg-v: linear-gradient(to bottom, #dbeafe, #dcfce7);
  --head-text: #003366;
  --line-strong: #1f2937;
  --muted: #6b7280;
}

body {
  margin: 0;
  font-family: "Segoe UI", "Noto Sans TC", "Noto Sans JP", sans-serif;
  background: var(--bg);
  background-attachment: fixed;
  color: var(--text);
  transition: 0.3s;
}

body.dark {
  --bg: linear-gradient(to right, #0f172a, #111827);
  --card: #1f2937;
  --text: #e0e7ff;
  --border: #374151;
  --table-head: #334155;
  --table-hover: #1e293b;
  --head-bg: linear-gradient(to right, #1e3a8a, #14532d);
  --head-bg-v: linear-gradient(to bottom, #1e3a8a, #14532d);
  --head-text: #e0e7ff;
  --line-strong: #9ca3af;
  --muted: #9ca3af;
}

/* ============================================================
   2. 導覽列
   ============================================================ */
.navbar {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(6px);
  padding: 10px 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  display: flex; align-items: center; gap: 10px;
}
body.dark .navbar { background: rgba(31, 41, 55, 0.9); }

.navbar .home-link,
.navbar .right-buttons a,
.navbar .right-buttons button {
  text-decoration: none;
  border-radius: 8px;
  border: 1px solid var(--main);
  display: inline-flex; align-items: center; gap: 4px;
  transition: 0.25s; cursor: pointer;
}

.navbar .home-link,
.navbar .right-buttons a {
  color: var(--main) !important;
  background-color: #ffffff !important;
  border: 1px solid var(--main) !important;
  padding: 4px 12px;
}

.navbar .right-buttons { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.navbar .right-buttons button { padding: 6px 12px; background: var(--card); color: var(--text); }

.navbar .home-link:hover,
.navbar .right-buttons a:hover,
.navbar .right-buttons button:hover {
  background-color: var(--main-dark) !important;
  color: white !important;
  border-color: var(--main-dark) !important;
}

/* ============================================================
   3. 內容卡片
   ============================================================ */
.content {
  max-width: 1000px;
  background: var(--card);
  padding: 20px 30px 30px;
  margin: 40px auto;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

.content h1 { text-align: center; color: var(--main); margin: 0 0 10px; }
body.dark .content h1 { color: #93c5fd; }

.trip-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ============================================================
   4. 可摺疊旅程卡片
   ============================================================ */
.trip {
  margin: 0 0 -1px;
  border: 1px solid #d8d8d8;
  border-radius: 0;
  overflow: hidden;
  background: var(--card);
  box-shadow: 0 2px 5px rgba(0,0,0,.06);
  position: relative;
  z-index: 1;
}
body.dark .trip { border-color: #4b5563; }

.trip-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 7px 14px;
  min-height: 38px;
  background: #edf3fb;
  cursor: pointer;
  transition: 0.2s;
}
.trip-header:hover { background: #dcecff; }
body.dark .trip-header { background: #2d3440; }
body.dark .trip-header:hover { background: #414b5c; }

.trip-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: bold; }
.arrow { width: 18px; text-align: center; font-size: 14px; transition: 0.2s; }
.trip-count { margin-left: 6px; color: #777; font-size: 14px; font-weight: 400; }
body.dark .trip-count { color: #cbd5e1; }

.trip-link {
  display: inline-flex; align-items: center; justify-content: center;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--main); border-radius: 6px;
  background: var(--card); color: var(--main);
  text-decoration: none !important; font-size: 14px;
  transition: 0.2s; flex-shrink: 0;
}
.trip-link:hover { background: var(--main); color: #fff; transform: translateY(-1px); }
body.dark .trip-link { border-color: #93c5fd; color: #93c5fd; background: #374151; }
body.dark .trip-link:hover { background: #4b6fd8; color: #fff; }

.trip-body { display: none; padding: 12px; background: var(--card); }

/* ============================================================
   5. 行程表
   ============================================================ */
.table-container { overflow-x: auto; }

.tra-table {
  width: 100%; min-width: 760px;
  border-collapse: collapse; table-layout: fixed;
  background: var(--card);
}

.tra-table th, .tra-table td {
  border: 1px solid var(--border);
  padding: 12px; font-size: 17px;
  vertical-align: middle; text-align: left;
}

.tra-table thead th {
  background: var(--head-bg); color: var(--head-text);
  font-size: 20px; font-weight: 700; text-align: center;
  border-top: 3px solid var(--line-strong);
  border-bottom: 3px solid var(--line-strong);
}
.tra-table thead th:first-child { border-right: 3px solid var(--line-strong); width: 14%; }

.tra-table tbody th {
  background: var(--head-bg-v); color: var(--head-text);
  font-size: 20px; font-weight: 700; text-align: center;
  border-right: 3px solid var(--line-strong);
  width: 14%;
}

.tra-table tbody tr { height: 100px; }
.tra-table tbody tr:last-child th,
.tra-table tbody tr:last-child td,
.tra-table td[rowspan] { border-bottom: 3px solid var(--line-strong); }

.tra-table a { color: var(--main); text-decoration: none; }
.tra-table a:hover { color: var(--main-dark); text-decoration: underline; }
body.dark .tra-table a { color: #93c5fd; }
body.dark .tra-table a:hover { color: #fff; }
.tra-table thead th a { color: inherit; }

.note { font-size: 14px; color: var(--muted); font-weight: normal; }
.flight { text-align: left !important; vertical-align: middle; }

/* Day1~Day4 內容：靠左上對齊（Day5 .flight 維持置中） */
.tra-table tbody td:not(.flight) { vertical-align: top; text-align: left; }

/* 項目清單（"-" 由 CSS 產生） */
.desc-list { list-style: none; padding: 0; margin: 0; }
.desc-list li { margin: 3px 0; padding-left: 14px; position: relative; line-height: 1.4; }
.desc-list li::before { content: "-"; position: absolute; left: 0; color: var(--text); }

/* ============================================================
   6. 回到頂部與響應式
   ============================================================ */
#topBtn {
  position: fixed; bottom: 20px; right: 20px; background: var(--main); color: white;
  border: none; padding: 10px 14px; border-radius: 50%; cursor: pointer; display: none;
}

@media (max-width: 700px) {
  .content { margin: 20px 12px; padding: 16px; }
  .navbar { padding: 8px 10px; flex-wrap: wrap; }
  .trip-header { padding: 8px 10px; }
  .trip-title { font-size: 16px; }
  .trip-link { height: 28px; font-size: 13px; }
}
</style>
</head>

<body>

<header class="navbar">
  <!-- 左側：回首頁 -->
  <a class="home-link" href="https://ba29bin06h.github.io/BL_Drama/Catalog.html">🎃 巴比恩的BL南瓜燈</a>

  <!-- 右側按鈕群 -->
  <div class="right-buttons">
    <a href="https://www.dcard.tw/@ba06bin29h" target="_blank">💬 Dcard 個人牆</a>
    <button id="darkBtn" onclick="toggleDark()">🌙 夜間模式</button>
  </div>
</header>

<div class="content">
  <h1>✈️ 巴比恩國外遊記</h1>

  <!-- 新旅程請放在這裡↓ -->

  <!-- 2025 首爾自由行 -->
  <div class="trip">
    <div class="trip-header">
      <div class="trip-title">
        <span class="arrow">▶</span>
        <span>2025 首爾自由行</span>
        <span class="trip-count"></span>
      </div>
      <div class="trip-actions">
        <a class="trip-link" href="https://ba29bin06h.github.io/Travel/2025Seoul_Five%20Palace.html">🏯 五大宮殿</a>
        <a class="trip-link" href="https://www.dcard.tw/f/travel/p/260537779" target="_blank" rel="noopener">Dcard 文章 🔗</a>
      </div>
    </div>
    <div class="trip-body">
      <div class="table-container">
        <table class="tra-table">
          <thead>
            <tr>
              <th></th>
              <th><a href="https://www.dcard.tw/f/korea_travel/p/260871159" target="_blank">Day1</a></th>
              <th><a href="https://www.dcard.tw/f/korea_travel/p/260887552" target="_blank">Day2</a></th>
              <th><a href="https://www.dcard.tw/f/korea_travel/p/260903797" target="_blank">Day3</a></th>
              <th><a href="https://www.dcard.tw/f/korea_travel/p/260922583" target="_blank">Day4</a></th>
              <th>Day5</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <th>上午</th>
              <td><ul class="desc-list"><li>坐飛機<br><span class="note">(0730~1100 長榮)</span></li></ul></td>
              <td><ul class="desc-list"><li>景福宮</li></ul></td>
              <td><ul class="desc-list"><li>臨津閣</li></ul></td>
              <td>
                <ul class="desc-list">
                  <li>宗廟</li>
                  <li>雲峴宮</li>
                </ul>
              </td>
              <td rowspan="2" class="flight">坐飛機<br><span class="note">(1600~1830 長榮)</span></td>
            </tr>

            <tr>
              <th>下午</th>
              <td>
                <ul class="desc-list">
                  <li>圜丘壇</li>
                  <li>慶熙宮</li>
                  <li>首爾塔</li>
                </ul>
              </td>
              <td>
                <ul class="desc-list">
                  <li>德壽宮</li>
                  <li>崇禮門</li>
                </ul>
              </td>
              <td>
                <ul class="desc-list">
                  <li>DMZ <span class="note">(+第三隧道)</span></li>
                  <li>都羅山展望台</li>
                  <li>統一村</li>
                </ul>
              </td>
              <td>
                <ul class="desc-list">
                  <li>昌德宮 <span class="note">(+秘苑)</span></li>
                  <li>昌慶宮</li>
                </ul>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 新旅程請放在這裡↑ -->
</div>

<button id="topBtn">↑</button>

<script>
// [01] 夜間模式
const toggleDark = () => {
  const isDark = document.body.classList.toggle("dark");
  document.getElementById("darkBtn").textContent = isDark ? "☀️ 日間模式" : "🌙 夜間模式";
};

// [02] 旅程卡片摺疊（預設收合，點標題列展開／收合）
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".trip").forEach(trip => {
    const header = trip.querySelector(".trip-header");
    const body = trip.querySelector(".trip-body");
    const arrow = trip.querySelector(".arrow");
    const countBox = trip.querySelector(".trip-count");
    const links = trip.querySelectorAll(".trip-link");

    // 天數 = 表頭中 Day 開頭的欄位數
    const days = Array.from(trip.querySelectorAll("thead th"))
      .filter(th => /^Day\d+/i.test(th.textContent.trim())).length;
    countBox.textContent = `共 ${days} 天`;

    body.style.display = "none";

    links.forEach(l => l.addEventListener("click", e => e.stopPropagation()));

    header.addEventListener("click", () => {
      const show = body.style.display === "none";
      body.style.display = show ? "block" : "none";
      arrow.textContent = show ? "▼" : "▶";
    });
  });
});

// [03] 回到頂部
const btn = document.getElementById("topBtn");
window.addEventListener("scroll", () => {
  btn.style.display = window.scrollY > 300 ? "block" : "none";
});
btn.addEventListener("click", () => {
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
